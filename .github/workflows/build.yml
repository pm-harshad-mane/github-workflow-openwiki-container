name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_openwiki_e2e:
        description: Run the credentialed OpenWiki end-to-end test
        required: false
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: openwiki-container:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag "${IMAGE_TAG}" .

      - name: Run smoke test
        env:
          SKIP_BUILD: "1"
        run: ./scripts/smoke-test.sh

      - name: Run container test suite
        env:
          SKIP_BUILD: "1"
        run: ./tests/run-tests.sh

      - name: Run OpenWiki end-to-end test
        if: ${{ vars.OPENWIKI_E2E_ENABLED == 'true' || github.event.inputs.run_openwiki_e2e == 'true' }}
        env:
          SKIP_BUILD: "1"
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_E2E_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_E2E_MODEL_ID }}
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          BEDROCK_AWS_REGION: ${{ vars.BEDROCK_AWS_REGION }}
          BEDROCK_AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          BEDROCK_AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
          COPILOT_BASE_URL: ${{ secrets.COPILOT_BASE_URL }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          BASETEN_BASE_URL: ${{ secrets.BASETEN_BASE_URL }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_BASE_URL: ${{ secrets.FIREWORKS_BASE_URL }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT }}
          LANGCHAIN_TRACING_V2: ${{ vars.LANGCHAIN_TRACING_V2 }}
        run: ./tests/run-openwiki-e2e.sh
